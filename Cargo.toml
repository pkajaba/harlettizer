# harlettizer — the encoder counterpart to harletty.
#
# Crates are added phase by phase (see PLAN.md). The dependency rule is that
# the codec crates (hz-ac3, hz-mlp, hz-dca, hz-ac4, hz-iamf) never depend on each other; they
# all sit on hz-core / hz-analysis / hz-render (and hz-matroska, the container
# a codec's frames go into, which knows none of them), and only hz-cli knows
# all of them. What every writer does before its own format — reading a master,
# its tracks and paths, rendering, mixing, overlaying — is hz-programme, which
# knows no codec crate either.
[workspace]
resolver = "3"
members = [
    "crates/hz-ac3",
    "crates/hz-analysis",
    "crates/hz-cli",
    "crates/hz-cluster",
    "crates/hz-core",
    "crates/hz-dca",
    "crates/hz-iamf",
    "crates/hz-joc",
    "crates/hz-io",
    "crates/hz-matroska",
    "crates/hz-meta",
    "crates/hz-mlp",
    "crates/hz-programme",
    "crates/hz-render",
    "crates/hz-stream",
    "crates/hz-stream-ffi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.87.0"
repository = "https://github.com/harletty/harlettizer"
authors = ["harletty"]

[workspace.dependencies]
hz-ac3 = { path = "crates/hz-ac3" }
hz-cluster = { path = "crates/hz-cluster" }
hz-core = { path = "crates/hz-core" }
hz-dca = { path = "crates/hz-dca" }
hz-iamf = { path = "crates/hz-iamf" }
hz-joc = { path = "crates/hz-joc" }
hz-analysis = { path = "crates/hz-analysis" }
hz-io = { path = "crates/hz-io" }
hz-matroska = { path = "crates/hz-matroska" }
hz-meta = { path = "crates/hz-meta" }
hz-mlp = { path = "crates/hz-mlp" }
hz-programme = { path = "crates/hz-programme" }
hz-render = { path = "crates/hz-render" }
hz-stream = { path = "crates/hz-stream" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.41"
same-file = "1"
# Optional, and only ever behind a `parallel` feature: the codec crates stay
# dependency-free so that nothing has to be trusted inside a hot loop or
# audited for the embedded target.
rayon = "1"

# Encoders run over whole programmes: an unoptimised debug build turns a two-hour
# title into an afternoon. Keep dependencies optimised even in dev.
[profile.dev.package."*"]
opt-level = 2
